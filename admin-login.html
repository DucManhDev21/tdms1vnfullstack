<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TDMS1VN — Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'};</script>
</head>
<body class="min-h-screen bg-black text-white">
<div class="min-h-screen grid place-items-center p-5 bg-[radial-gradient(circle_at_top,#272727,transparent_48%),#050505]">
  <div class="w-full max-w-md rounded-3xl border border-white/10 bg-[#101212]/95 p-6 shadow-2xl sm:p-8">
    <div class="text-xs font-bold uppercase tracking-[.2em] text-neutral-400">TDMS1VN Security</div>
    <h1 class="mt-2 text-3xl font-black">Admin Login</h1>
    <p class="mt-2 text-sm leading-6 text-neutral-400">Khu vực riêng. Chỉ Gmail đã cấu hình trong ADMIN_EMAIL trên Railway mới được cấp quyền truy cập.</p>
    <form id="adminForm" class="mt-6 space-y-4">
      <div><label class="mb-2 block text-sm font-bold">Gmail</label><input id="email" type="email" autocomplete="username" required class="w-full rounded-xl border border-white/10 bg-[#1a1d1d] px-4 py-3 outline-none focus:border-white" placeholder="admin@gmail.com"></div>
      <div><label class="mb-2 block text-sm font-bold">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required class="w-full rounded-xl border border-white/10 bg-[#1a1d1d] px-4 py-3 outline-none focus:border-white" placeholder="••••••••"></div>
      <div id="error" class="hidden rounded-xl border border-red-500/20 bg-red-950/30 px-4 py-3 text-sm text-red-300"></div>
      <button id="submit" class="w-full rounded-xl bg-white px-4 py-3.5 font-black text-black transition hover:bg-slate-200 disabled:opacity-50">Đăng nhập Admin</button>
    </form>
    <a href="/" class="mt-5 block text-center text-sm font-bold text-neutral-400 hover:text-white">← Về website</a>
  </div>
</div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,setPersistence,browserLocalPersistence,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
/* --- CONFIG & STATE --- */
    const firebaseConfig={apiKey:'AIzaSyAIkcg_JzSCWORJt4EKm0gG4XOCcz8a7UI',authDomain:'mstchat-f967d.firebaseapp.com',databaseURL:'https://mstchat-f967d-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'mstchat-f967d',storageBucket:'mstchat-f967d.firebasestorage.app',messagingSenderId:'13505298709',appId:'1:13505298709:web:da999c2d5f25d9bb4fa91c',measurementId:'G-5S081E93W6'};
/* --- FIREBASE INITIALIZATION --- */
    const app=initializeApp(firebaseConfig),auth=getAuth(app); await setPersistence(auth,browserLocalPersistence);
const form=document.getElementById('adminForm'),error=document.getElementById('error'),btn=document.getElementById('submit');
/* --- UTILS --- */
    function fail(message){error.textContent=message;error.classList.remove('hidden');}
/* --- AUTHENTICATION & API --- */
    form.addEventListener('submit',async e=>{e.preventDefault();error.classList.add('hidden');btn.disabled=true;try{const cred=await signInWithEmailAndPassword(auth,document.getElementById('email').value.trim(),document.getElementById('password').value);const token=await cred.user.getIdToken(true);const r=await fetch('/api/admin/session',{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok||!data.admin){await signOut(auth);throw new Error(data.error||`Admin API trả về HTTP ${r.status}.`);}location.href='/admin.html';}catch(err){fail(err.message||'Đăng nhập Admin thất bại.');}finally{btn.disabled=false;}});
  </script>
</body>
</html>
