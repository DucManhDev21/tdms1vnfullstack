  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .glass { backdrop-filter: blur(16px); background: rgba(255,255,255,.82); }
    .dark .glass { background: rgba(15,23,42,.82); }
    .page-transition { animation: pageIn .22s ease-out; }
    @keyframes pageIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .shimmer { background: linear-gradient(90deg, rgba(226,232,240,.65) 25%, rgba(248,250,252,.95) 50%, rgba(226,232,240,.65) 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
    .dark .shimmer { background: linear-gradient(90deg, rgba(30,41,59,.8) 25%, rgba(51,65,85,.95) 50%, rgba(30,41,59,.8) 75%); background-size: 200% 100%; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .toast { animation: toastIn .2s ease-out; }
    @keyframes toastIn { from { opacity:0; transform: translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    .sidebar-overlay { background: rgba(2,6,23,.42); }
    .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    input, select, textarea { outline: none; }

</head>
<body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <div id="authLoading" class="fixed inset-0 z-[100] bg-slate-50 dark:bg-slate-950 flex items-center justify-center">
    <div class="w-full max-w-md px-6">
      <div class="h-8 w-44 rounded-lg shimmer"></div>
      <div class="mt-6 h-20 rounded-2xl shimmer"></div>
      <div class="mt-3 h-32 rounded-2xl shimmer"></div>
      <div class="mt-3 h-12 rounded-xl shimmer"></div>
    </div>
  </div>

  <div id="sidebarOverlay" class="fixed inset-0 z-40 hidden sidebar-overlay"></div>
  <aside id="sidebar" class="fixed left-0 top-0 z-50 h-full w-72 -translate-x-full border-r border-slate-200 bg-white p-5 shadow-2xl transition-transform dark:border-slate-800 dark:bg-slate-900">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="/logo.png" alt="TDMS1VN" class="h-12 w-20 rounded-xl object-contain bg-slate-50 dark:bg-slate-800" width="677" height="369">
        <div>
          <div class="font-extrabold">TDMS1VN</div>
          <div class="text-xs text-slate-500">Automated Services</div>
        </div>
      </div>
      <button id="closeSidebar" class="rounded-lg px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Đóng menu"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <nav id="sideNav" class="mt-8 space-y-1"></nav>
    <div class="mt-6 rounded-2xl bg-slate-100 p-4 dark:bg-slate-800/70">
      <div class="text-xs text-slate-500">Tài khoản</div>
      <div id="sideEmail" class="mt-1 truncate text-sm font-semibold">Đang tải...</div>
      <button id="sideLogout" class="mt-3 w-full rounded-xl bg-slate-900 px-3 py-2 text-sm font-semibold text-white dark:bg-white dark:text-slate-900"><i class="fa-solid fa-right-from-bracket mr-2"></i>Đăng xuất</button>
    </div>
  </aside>

  <div id="authScreen" class="hidden min-h-screen px-4 py-10">
    <div class="mx-auto max-w-md">
      <div class="text-center">
        <img src="/logo.png" alt="TDMS1VN" class="mx-auto h-24 w-44 object-contain" width="677" height="369">
        <h1 class="mt-4 text-3xl font-extrabold">Chào mừng đến TDMS1VN</h1>
        <p class="mt-2 text-sm text-slate-500">Quản lý dịch vụ, đơn hàng và số dư trên một hệ thống.</p>
      </div>
      <div class="mt-7 rounded-3xl border border-slate-200 bg-white p-6 shadow-soft dark:border-slate-800 dark:bg-slate-900">
        <div class="flex rounded-xl bg-slate-100 p-1 dark:bg-slate-800">
          <button data-auth-tab="login" class="auth-tab flex-1 rounded-lg bg-white px-4 py-2 text-sm font-semibold shadow-sm dark:bg-slate-700">Đăng nhập</button>
          <button data-auth-tab="register" class="auth-tab flex-1 rounded-lg px-4 py-2 text-sm font-semibold text-slate-500">Đăng ký</button>
        </div>
        <form id="authForm" class="mt-5 space-y-4">
          <div>
            <label class="mb-1 block text-sm font-medium">Email</label>
            <input id="authEmail" type="email" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 dark:border-slate-700 dark:bg-slate-950" placeholder="you@example.com">
          </div>
          <div>
            <label class="mb-1 block text-sm font-medium">Mật khẩu</label>
            <input id="authPassword" type="password" minlength="6" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 dark:border-slate-700 dark:bg-slate-950" placeholder="Tối thiểu 6 ký tự">
          </div>
          <button class="w-full rounded-xl bg-slate-900 px-4 py-3 font-bold text-white hover:bg-slate-800 dark:bg-white dark:text-slate-900">Tiếp tục</button>
        </form>
        <div class="my-5 flex items-center gap-3 text-xs text-slate-400"><span class="h-px flex-1 bg-slate-200 dark:bg-slate-700"></span>HOẶC<span class="h-px flex-1 bg-slate-200 dark:bg-slate-700"></span></div>
        <button id="googleBtn" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 font-semibold hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-950 dark:hover:bg-slate-900"><i class="fa-brands fa-google mr-2"></i>Tiếp tục với Google</button>
        <p id="authError" class="mt-4 hidden rounded-xl bg-red-50 p-3 text-sm text-red-700 dark:bg-red-950/40 dark:text-red-300"></p>
      </div>
    </div>
  </div>

  <div id="app" class="hidden min-h-screen">
    <header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/85 backdrop-blur dark:border-slate-800 dark:bg-slate-950/85">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6">
        <div class="flex items-center gap-3">
          <button id="openSidebar" class="rounded-xl border border-slate-200 px-3 py-2 hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800" aria-label="Mở menu"><i class="fa-solid fa-bars"></i></button>
          <div>
            <div class="text-sm font-extrabold">TDMS1VN</div>
            <div class="text-[11px] text-slate-500">Digital Services</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div class="hidden rounded-xl bg-slate-100 px-3 py-2 text-sm font-semibold sm:block dark:bg-slate-900"><i class="fa-solid fa-wallet mr-2"></i><span id="headerBalance">0đ</span></div>
          <button id="themeBtn" class="rounded-xl border border-slate-200 px-3 py-2 hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800" aria-label="Đổi giao diện"><i class="fa-solid fa-moon"></i></button>
          <button data-route="/tai-khoan" class="rounded-xl border border-slate-200 px-3 py-2 hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800" aria-label="Tài khoản"><i class="fa-solid fa-user"></i></button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6">
      <div id="page" class="page-transition"></div>
    </main>
  </div>

  <div id="popupModal" class="fixed inset-0 z-[80] hidden items-center justify-center bg-slate-950/50 p-4">
    <div class="relative w-full max-w-lg rounded-3xl bg-white p-6 shadow-2xl dark:bg-slate-900">
      <button id="popupClose" class="absolute right-4 top-4 rounded-lg px-3 py-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button>
      <div class="pr-10">
        <div class="text-xs font-bold uppercase tracking-[.15em] text-slate-500">Thông báo Admin</div>
        <h2 id="popupTitle" class="mt-2 text-2xl font-extrabold">Thông báo</h2>
        <div id="popupContent" class="mt-4 whitespace-pre-wrap text-sm leading-7 text-slate-600 dark:text-slate-300"></div>
      </div>
      <button id="popupRead" disabled class="mt-6 w-full rounded-xl bg-slate-900 px-4 py-3 font-bold text-white disabled:cursor-not-allowed disabled:opacity-40 dark:bg-white dark:text-slate-900">Tôi đã đọc và không hiển thị lại (3)</button>
    </div>
  </div>

  <div id="toastStack" class="fixed right-4 top-4 z-[90] w-[min(92vw,360px)] space-y-2"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut, updatePassword } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import { getFirestore, doc, getDoc, setDoc, collection, onSnapshot, query, orderBy, limit, getDocs } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyAIkcg_JzSCWORJt4EKm0gG4XOCcz8a7UI',
      authDomain: 'mstchat-f967d.firebaseapp.com',
      databaseURL: 'https://mstchat-f967d-default-rtdb.asia-southeast1.firebasedatabase.app',
      projectId: 'mstchat-f967d',
      storageBucket: 'mstchat-f967d.firebasestorage.app',
      messagingSenderId: '13505298709',
      appId: '1:13505298709:web:da999c2d5f25d9bb4fa91c',
      measurementId: 'G-5S081E93W6'
    };

    const API_BASE = 'https://tdms1vnback-production.up.railway.app/api';
    const PLATFORM_LIST = ['TikTok', 'Facebook', 'Instagram', 'Youtube', 'Telegram', 'Shopee'];
    const NAV = [
      ['/trang-chu', 'Trang chủ', 'fa-house'],
      ['/tai-khoan', 'Tài khoản', 'fa-user'],
      ['/nap-tien', 'Nạp tiền', 'fa-wallet'],
      ['/dat-hang', 'Đặt hàng', 'fa-cart-shopping'],
      ['/don-hang-da-tat', 'Đơn hàng đã đặt', 'fa-boxes-stacked'],
      ['/bien-dong-so-du', 'Biến động số dư', 'fa-money-bill-transfer'],
      ['/lich-su-nap-tien', 'Lịch sử nạp tiền', 'fa-clock-rotate-left'],
      ['/lien-he', 'Liên hệ', 'fa-headset']
    ];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    await setPersistence(auth, browserLocalPersistence);

    const state = {
      user: null,
      balance: 0,
      services: [],
      config: null,
      serviceId: '',
      platform: '',
      category: '',
      selectedService: null,
      orderLink: '',
      orderQty: 0,
      authMode: 'login',
      popupUnsub: null,
      servicesLoaded: false,
      page: ''
    };

    const $ = (id) => document.getElementById(id);
    const money = (v) => `${Math.round(Number(v || 0)).toLocaleString('vi-VN')}đ`;
    const esc = (v) => String(v ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const fmtDate = (v) => {
      const d = v?.toDate ? v.toDate() : (v ? new Date(v) : null);
      return d && !Number.isNaN(d.valueOf()) ? d.toLocaleString('vi-VN') : '—';
    };
    const showToast = (message, type='info') => {
      const el = document.createElement('div');
      const map = {success:'bg-emerald-600', error:'bg-red-600', info:'bg-slate-900', warning:'bg-amber-500'};
      el.className = `toast rounded-xl px-4 py-3 text-sm font-semibold text-white shadow-xl ${map[type] || map.info}`;
      el.textContent = message;
      $('toastStack').appendChild(el);
      setTimeout(() => el.remove(), 3600);
    };
    const setAuthError = (message='') => {
      $('authError').textContent = message;
      $('authError').classList.toggle('hidden', !message);
    };
    const api = async (path, options={}) => {
      const token = state.user ? await state.user.getIdToken() : '';
      const headers = new Headers(options.headers || {});
      if (token) headers.set('Authorization', `Bearer ${token}`);
      if (options.body && typeof options.body !== 'string') {
        headers.set('Content-Type', 'application/json');
        options.body = JSON.stringify(options.body);
      }
      const response = await fetch(`${API_BASE}${path}`, {...options, headers});
      let data = null;
      try { data = await response.json(); } catch {}
      if (!response.ok) throw new Error(data?.error || `HTTP ${response.status}`);
      return data;
    };

    function openSidebar() { $('sidebar').classList.remove('-translate-x-full'); $('sidebarOverlay').classList.remove('hidden'); }
    function closeSidebar() { $('sidebar').classList.add('-translate-x-full'); $('sidebarOverlay').classList.add('hidden'); }

    function buildNav() {
      $('sideNav').innerHTML = NAV.map(([route, label, icon]) => `
        <button data-route="${route}" class="nav-item flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm font-semibold text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
          <i class="fa-solid ${icon} w-5 text-center"></i><span>${label}</span>
        </button>`).join('');
    }

    function setRouteActive() {
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.toggle('bg-slate-900', btn.dataset.route === state.page));
      document.querySelectorAll('.nav-item').forEach(btn => {
        if (btn.dataset.route === state.page) btn.classList.add('text-white'); else btn.classList.remove('text-white');
      });
    }

    function go(route) {
      const target = NAV.some(x => x[0] === route) ? route : '/trang-chu';
      history.pushState({}, '', target);
      state.page = target;
      setRouteActive();
      render();
      closeSidebar();
      window.scrollTo({top:0, behavior:'smooth'});
    }

    async function ensureUserDoc(user) {
      const ref = doc(db, 'users', user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          email: user.email || '',
          balance: 0,
          role: 'user',
          createdAt: new Date()
        });
      }
    }

    function watchBalance(user) {
      return onSnapshot(doc(db, 'users', user.uid), snap => {
        state.balance = Number(snap.data()?.balance || 0);
        $('headerBalance').textContent = money(state.balance);
        renderIf('/trang-chu');
        renderIf('/dat-hang');
      });
    }

    let balanceUnsub = null;
    function renderIf(route) { if (state.page === route) render(); }

    async function loadPublicConfig() {
      try { state.config = await api('/config/public'); } catch { state.config = null; }
    }

    async function loadServices() {
      if (state.servicesLoaded) return;
      const data = await api('/services');
      state.services = Array.isArray(data.services) ? data.services : [];
      state.servicesLoaded = true;
    }

    function setupPopupWatcher() {
      if (state.popupUnsub) state.popupUnsub();
      const q = query(collection(db, 'popups'), orderBy('createdAt', 'desc'), limit(10));
      state.popupUnsub = onSnapshot(q, snap => {
        const popup = snap.docs.map(d => d.data()).find(x => x?.id && !localStorage.getItem(`tdms_popup_read_${x.id}`));
        if (popup && state.page === '/trang-chu') showPopup(popup);
      }, () => {});
    }

    function showPopup(popup) {
      $('popupTitle').textContent = popup.title || 'Thông báo';
      $('popupContent').textContent = popup.content || '';
      const button = $('popupRead');
      button.disabled = true;
      let left = 3;
      button.textContent = `Tôi đã đọc và không hiển thị lại (${left})`;
      const timer = setInterval(() => {
        left -= 1;
        if (left <= 0) { clearInterval(timer); button.disabled = false; button.textContent = 'Tôi đã đọc và không hiển thị lại'; }
        else button.textContent = `Tôi đã đọc và không hiển thị lại (${left})`;
      }, 1000);
      button.dataset.popupId = popup.id;
      $('popupModal').classList.remove('hidden');
      $('popupModal').classList.add('flex');
    }

    function hidePopup(markRead=false) {
      const id = $('popupRead').dataset.popupId;
      if (markRead && id) localStorage.setItem(`tdms_popup_read_${id}`, '1');
      $('popupModal').classList.add('hidden');
      $('popupModal').classList.remove('flex');
    }

    const statCard = (label, value, icon) => `<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900"><div class="flex items-center justify-between"><div><div class="text-sm text-slate-500">${label}</div><div class="mt-2 text-2xl font-extrabold" data-stat-value>${value}</div></div><div class="rounded-xl bg-slate-100 px-3 py-2 dark:bg-slate-800"><i class="fa-solid ${icon}"></i></div></div></div>`;

    async function loadStats() {
      try { return await api('/public/stats'); } catch { return { users: 0, orders: 0, completed: 0 }; }
    }

    async function homePage() {
      const stats = await loadStats();
      return `
        <section class="page-transition">
          <div class="overflow-hidden rounded-3xl bg-slate-900 p-7 text-white shadow-soft sm:p-10">
            <div class="max-w-3xl">
              <div class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/10 px-3 py-1 text-xs font-bold"><i class="fa-solid fa-bolt"></i> Nền tảng tự động hóa dịch vụ số</div>
              <h1 class="mt-5 text-4xl font-extrabold leading-tight sm:text-5xl">Quản lý dịch vụ, đặt hàng và số dư thật — tập trung trong TDMS1VN.</h1>
              <p class="mt-5 max-w-2xl text-sm leading-7 text-slate-300">Theo dõi số dư realtime, chọn dịch vụ theo Service ID, đặt đơn nhanh và đồng bộ trạng thái từ Provider. Quy trình thanh toán được xác thực lại ở Backend bằng Firestore Transaction trước khi trừ tiền.</p>
              <div class="mt-7 flex flex-wrap gap-3">
                <button data-route="/dat-hang" class="rounded-xl bg-white px-5 py-3 font-bold text-slate-900">Đặt hàng ngay</button>
                <button data-route="/nap-tien" class="rounded-xl border border-white/20 bg-white/10 px-5 py-3 font-bold">Nạp tiền</button>
              </div>
            </div>
          </div>
          <div class="mt-6 grid gap-4 sm:grid-cols-3">
            ${statCard('Người dùng', stats.users?.toLocaleString('vi-VN') || '0', 'fa-users')}
            ${statCard('Đơn hàng', stats.orders?.toLocaleString('vi-VN') || '0', 'fa-box-open')}
            ${statCard('Hoàn thành', stats.completed?.toLocaleString('vi-VN') || '0', 'fa-circle-check')}
          </div>
          <div class="mt-8 grid gap-4 lg:grid-cols-3">
            <div class="rounded-2xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900"><i class="fa-solid fa-shield-halved text-xl"></i><h3 class="mt-4 font-extrabold">Kiểm soát số dư hai lớp</h3><p class="mt-2 text-sm leading-6 text-slate-500">Frontend cảnh báo realtime, Backend xác thực lại trong Transaction để tránh race condition.</p></div>
            <div class="rounded-2xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900"><i class="fa-solid fa-rotate text-xl"></i><h3 class="mt-4 font-extrabold">Đồng bộ Provider</h3><p class="mt-2 text-sm leading-6 text-slate-500">Khi mở trang đơn hàng, hệ thống gọi Backend để lấy status mới nhất và xử lý hoàn tiền Partial/Canceled.</p></div>
            <div class="rounded-2xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900"><i class="fa-solid fa-bell text-xl"></i><h3 class="mt-4 font-extrabold">Thông báo Admin</h3><p class="mt-2 text-sm leading-6 text-slate-500">Popup được lưu theo ID trong localStorage để người dùng đã đọc không bị hiện lại.</p></div>
          </div>
          <div class="mt-8 rounded-3xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900">
            <div class="text-xs font-bold uppercase tracking-[.15em] text-slate-500">Quy trình 3 bước</div>
            <div class="mt-5 grid gap-5 md:grid-cols-3">
              ${[['01','Nạp tiền','Nạp thẻ hoặc chuyển khoản theo thông tin Admin.'],['02','Chọn dịch vụ','Tìm Service ID, chọn nền tảng, category và dịch vụ.'],['03','Đặt & theo dõi','Đặt đơn, xem status realtime và lịch sử giao dịch.']].map(([n,t,d]) => `<div class="rounded-2xl bg-slate-50 p-5 dark:bg-slate-800/60"><div class="text-xs font-extrabold text-slate-500">${n}</div><div class="mt-2 font-extrabold">${t}</div><div class="mt-2 text-sm text-slate-500">${d}</div></div>`).join('')}
            </div>
          </div>
        </section>`;
    }

    function accountPage() {
      return `

    async function render() {
      if (!state.user) return;
      const route = state.page;
      let html = '';
      if (route === '/trang-chu') html = await homePage();
      else if (route === '/tai-khoan') html = accountPage();
      else if (route === '/nap-tien') html = depositPage();
      else if (route === '/dat-hang') { await loadServices(); html = await orderPage(); }
      else if (route === '/don-hang-da-tat') html = await ordersPage();
      else if (route === '/bien-dong-so-du') html = await balanceLogsPage();
      else if (route === '/lich-su-nap-tien') html = await depositHistoryPage();
      else if (route === '/lien-he') html = contactPage();
      $('page').innerHTML = html;
      bindPageHandlers();
      setRouteActive();
      if (route === '/trang-chu') {
        setTimeout(() => setupPopupWatcher(), 0);
      }
    }

    function bindPageHandlers() {
      document.querySelectorAll('[data-route]').forEach(btn => btn.onclick = () => go(btn.dataset.route));
      const passwordForm = $('passwordForm');
      if (passwordForm) passwordForm.onsubmit = async (e) => {
        e.preventDefault();
        try { await updatePassword(state.user, $('newPassword').value); showToast('Đổi mật khẩu thành công', 'success'); passwordForm.reset(); }
        catch (error) { showToast(error.message, 'error'); }
      };
      document.querySelectorAll('[data-deposit-tab]').forEach(btn => btn.onclick = () => {
        document.querySelectorAll('.deposit-tab').forEach(x => x.classList.remove('bg-slate-900','text-white'));
        document.querySelectorAll('.deposit-tab').forEach(x => x.classList.add('text-slate-500'));
        btn.classList.add('bg-slate-900','text-white'); btn.classList.remove('text-slate-500');
        $('depositTabCard')?.classList.toggle('hidden', btn.dataset.depositTab !== 'card');
        $('depositTabBank')?.classList.toggle('hidden', btn.dataset.depositTab !== 'bank');
      });
      const cardForm = $('cardForm');
      if (cardForm) cardForm.onsubmit = async (e) => {
        e.preventDefault();
        try {
          await api('/deposits/cards', {method:'POST', body:{ cardType:$('cardType').value, amount:Number($('cardAmount').value), serial:$('cardSerial').value, code:$('cardCode').value }});
          showToast('Đã gửi yêu cầu nạp thẻ', 'success'); cardForm.reset();
        } catch (error) { showToast(error.message, 'error'); }
      };
      const platform = $('platformSelect');
      if (platform) platform.onchange = () => { state.platform = platform.value; state.category = ''; state.selectedService = null; render(); };
      const category = $('categorySelect');
      if (category) category.onchange = () => { state.category = category.value; state.selectedService = null; render(); };
      const service = $('serviceSelect');
      if (service) service.onchange = () => { state.serviceId = service.value; state.selectedService = state.services.find(x => x.service === Number(service.value)) || null; state.platform = state.selectedService?.platform || state.platform; state.category = state.selectedService?.category || state.category; render(); };
      const serviceSearch = $('serviceSearch');
      if (serviceSearch) serviceSearch.oninput = () => {
        state.serviceId = serviceSearch.value.trim();
        const found = state.services.find(x => String(x.service) === state.serviceId);
        if (found) { state.selectedService = found; state.platform = found.platform; state.category = found.category; render(); }
      };
      $('clearServiceSearch')?.addEventListener('click', () => { state.serviceId=''; state.selectedService=null; render(); });
      const link = $('orderLink');
      if (link) link.oninput = () => { state.orderLink = link.value; updateOrderPreview(); };
      const qty = $('orderQty');
      if (qty) qty.oninput = () => { state.orderQty = Number(qty.value || 0); updateOrderPreview(); };
      const orderBtn = $('placeOrderBtn');
      if (orderBtn) orderBtn.onclick = submitOrder;
    }

    function updateOrderPreview() {
      const selected = state.selectedService;
      const total = selected ? Number(selected.rate) * Number(state.orderQty || 0) : 0;
      if ($('orderTotal')) $('orderTotal').textContent = money(total);
      const validQty = selected && Number(state.orderQty) >= Number(selected.min) && Number(state.orderQty) <= Number(selected.max);
      const enough = total <= state.balance;
      let hint = '';
      if (selected && total > state.balance) hint = 'Số dư không đủ';
      else if (selected && state.orderQty && !validQty) hint = `Số lượng phải từ ${selected.min} đến ${selected.max}`;
      else if (selected && !state.orderLink.trim()) hint = 'Vui lòng nhập link';
      if ($('orderHint')) { $('orderHint').textContent = hint; $('orderHint').className = `mt-2 text-sm ${hint==='Số dư không đủ'?'font-bold text-red-600':'text-slate-500'}`; }
      const canOrder = selected && state.orderLink.trim() && validQty && enough;
      if ($('placeOrderBtn')) $('placeOrderBtn').disabled = !canOrder;
    }

    async function submitOrder() {
      const btn = $('placeOrderBtn');
      if (!state.selectedService) return;
      const total = Number(state.selectedService.rate) * Number(state.orderQty || 0);
      if (total > state.balance) return showToast('Số dư không đủ', 'error');
      btn.disabled = true;
      try {
        const data = await api('/orders', {method:'POST', headers:{'Idempotency-Key': crypto.randomUUID()}, body:{serviceId:state.selectedService.service, link:state.orderLink.trim(), quantity:Number(state.orderQty)}});
        showToast(`Đặt đơn thành công: ${data.orderId}`, 'success');
        state.orderLink = ''; state.orderQty = 0; go('/don-hang-da-tat');
      } catch (error) {
        showToast(error.message, 'error');
        btn.disabled = false;
        updateOrderPreview();
      }
    }

    document.addEventListener('click', (e) => {
      const routeBtn = e.target.closest('[data-route]');
      if (routeBtn) go(routeBtn.dataset.route);
    });
    $('openSidebar').onclick = openSidebar;
    $('closeSidebar').onclick = closeSidebar;
    $('sidebarOverlay').onclick = closeSidebar;
    $('sideLogout').onclick = () => signOut(auth);
    $('popupClose').onclick = () => hidePopup(false);
    $('popupRead').onclick = () => hidePopup(true);
    $('themeBtn').onclick = () => {
      const dark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('tdms_theme', dark ? 'dark' : 'light');
    };
    if (localStorage.getItem('tdms_theme') === 'dark') document.documentElement.classList.add('dark');

    document.querySelectorAll('[data-auth-tab]').forEach(btn => btn.onclick = () => {
      state.authMode = btn.dataset.authTab;
      document.querySelectorAll('[data-auth-tab]').forEach(x=>x.classList.toggle('bg-white',x.dataset.authTab===state.authMode));
      document.querySelectorAll('[data-auth-tab]').forEach(x=>x.classList.toggle('shadow-sm',x.dataset.authTab===state.authMode));
    });
    $('authForm').onsubmit = async (e) => {
      e.preventDefault(); setAuthError('');
      try {
        if (state.authMode === 'login') await signInWithEmailAndPassword(auth, $('authEmail').value, $('authPassword').value);
        else await createUserWithEmailAndPassword(auth, $('authEmail').value, $('authPassword').value);
      } catch (error) { setAuthError(error.message); }
    };
    $('googleBtn').onclick = async () => {
      setAuthError('');
      try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (error) { setAuthError(error.message); }
    };
    window.addEventListener('popstate', () => { state.page = location.pathname; render(); });

    onAuthStateChanged(auth, async (user) => {
      $('authLoading').classList.remove('hidden');
      if (balanceUnsub) { balanceUnsub(); balanceUnsub = null; }
      if (!user) {
        state.user = null; state.page='';
        $('app').classList.add('hidden'); $('authScreen').classList.remove('hidden'); $('authLoading').classList.add('hidden');
        return;
      }
      try {
        state.user = user;
        await ensureUserDoc(user);
        await loadPublicConfig();
        balanceUnsub = watchBalance(user);
        $('sideEmail').textContent = user.email || '';
        $('authScreen').classList.add('hidden'); $('app').classList.remove('hidden'); $('authLoading').classList.add('hidden');
        buildNav();
        state.page = NAV.some(x=>x[0]===location.pathname) ? location.pathname : '/trang-chu';
        await render();
      } catch (error) {
        setAuthError(error.message);
        await signOut(auth);
      }
    });
  </script>
</body>
</html>
